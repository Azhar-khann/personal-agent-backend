name: personal-agent-backend

services:
  postgres:
    # 16 matches the local psql client and is what Neon/Supabase serve.
    # btree_gist ships in postgres-contrib, which is present in the official image.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: personal_agent
      POSTGRES_PASSWORD: personal_agent
      POSTGRES_DB: personal_agent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_agent -d personal_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
